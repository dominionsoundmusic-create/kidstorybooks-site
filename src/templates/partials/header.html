<header class="site-header">
<div class="site-header__inner">
<a class="logo" href="/" aria-label="Kid Story Books home"><img src="/favicon.svg" alt="" width="36" height="37"><span>Kid Story Books</span></a>
<button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav"><span class="nav-toggle__bars" aria-hidden="true"></span><span>Menu</span></button>
<nav id="site-nav" class="site-nav" aria-label="Main">
<ul class="site-nav__list" role="list">
{% for item in site.nav %}
{% if item.children is defined %}
<li class="has-sub"><button type="button" class="sub-toggle" aria-expanded="false">{{ item.label }}<svg viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<ul class="sub" role="list">
{% for c in item.children %}<li><a href="{{ c.href }}"{% if c.href == page.url %} aria-current="page"{% endif %}>{{ c.label }}</a></li>{% endfor %}
</ul></li>
{% else %}
<li><a class="site-nav__link" href="{{ item.href }}"{% if item.href == page.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
{% endif %}
{% endfor %}
</ul>
</nav>
<div class="header-tools">
{{ m.social("social--header") }}
<div class="lang" role="group" aria-label="Language"><button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button><button type="button" class="lang__btn" data-lang="es" aria-pressed="false">ES</button></div>
</div>
</div>
<div id="google_translate_element" hidden></div>
</header>
